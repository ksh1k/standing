<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><title>Intake</title><link rel="stylesheet" href="/style.css"/><script src="/app.js" defer></script></head>
<body><header><h1>Student intake</h1><nav>
<a href="/">Home</a><a href="/intake.html">Intake</a><a href="/groups.html">My groups</a><a href="/dashboard.html">Dashboard</a>
</nav></header><main>
<form class="card" onsubmit="StandingUI.submitIntake(event)">
<label>Student ID</label><input id="student_id" required placeholder="s0"/>
<label>Display name</label><input id="display_name" required placeholder="Alex"/>
<label>Year</label><select id="year"><option>freshman</option><option>sophomore</option><option selected>junior</option><option>senior</option><option>grad</option></select>
<label>Courses (comma-separated)</label><input id="courses" placeholder="CSCE315, MATH304"/>
<label>Preferred group size</label><select id="group_size"><option>4</option><option selected>5</option><option>6</option></select>
<label>Study style</label><select id="study_style"><option value="quiet_parallel">quiet_parallel</option><option value="discussion" selected>discussion</option><option value="problem_drilling">problem_drilling</option></select>
<label>Preferred public zones</label><div class="zones">
<label><input type="checkbox" name="zone" value="main_library" checked/> main_library</label>
<label><input type="checkbox" name="zone" value="student_center"/> student_center</label>
<label><input type="checkbox" name="zone" value="engineering_quad"/> engineering_quad</label>
<label><input type="checkbox" name="zone" value="west_campus"/> west_campus</label>
<label><input type="checkbox" name="zone" value="east_campus"/> east_campus</label></div>
<label>ToD weights (m/a/e)</label><div class="row">
<input id="tod_m" type="number" step="0.1" value="1.0" style="width:5rem"/>
<input id="tod_a" type="number" step="0.1" value="1.0" style="width:5rem"/>
<input id="tod_e" type="number" step="0.1" value="1.0" style="width:5rem"/></div>
<p class="muted">No residence. Availability defaults all-free on member agent.</p>
<button type="submit">Save profile</button><p id="intake_status" class="muted"></p></form></main></body></html>
